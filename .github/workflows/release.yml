name: Release

# Push a tag like v1.2.0 to publish images and a GitHub release. Running
# NexOS installations offer the update to their admins; nothing updates
# automatically.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/nexosv2

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [hub, agent]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Published only after both images exist, so installations never see
        # a release whose images cannot be pulled yet.
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
